name: "🛡️ Security Audit Gate"

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit-gate:
    name: "Audit gate (direct high/critical)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Tester la policy de sécurité sans dépendances
        run: node --test .github/scripts/node-tests/security-audit-gate.cli.mjs

      - name: Installation des dépendances
        # S'appuyer sur le manifeste/lockfile du dépôt pour éviter toute
        # réintroduction d'une version Amplify CLI forcée et non publiée.
        run: npm ci

      - name: Vérification TypeScript (typecheck)
        run: npm run typecheck

      - name: Exécution des tests
        run: npm test

      - name: Vérifier l'usage de glob sans entrée non fiable
        run: node .github/scripts/no-untrusted-glob-patterns.mjs

      - name: Générer le rapport audit JSON
        run: npm audit --json > audit.json || true

      - name: Appliquer la policy de sécurité CI
        run: node .github/scripts/security-audit-gate.mjs audit.json .github/security/audit-exceptions.json

      - name: Conserver le rapport npm audit même en échec
        if: ${{ always() && hashFiles('audit.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit.json
          if-no-files-found: error
          retention-days: 7

  weekly-upstream-monitor:
    name: "Weekly upstream monitor (temporary transitive security exceptions)"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Installation des dépendances
        # S'appuyer sur le manifeste/lockfile du dépôt pour éviter toute
        # réintroduction d'une version Amplify CLI forcée et non publiée.
        run: npm ci

      - name: Générer le rapport audit JSON
        run: npm audit --json > audit.json || true

      - name: Vérifier l'amont et la dérogation
        run: node .github/scripts/security-upstream-monitor.mjs audit.json .github/security/audit-exceptions.json
