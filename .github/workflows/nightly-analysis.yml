name: "🔍 Analyse Nocturne du Dépôt"

on:
  schedule:
    # Tous les jours à 2h du matin (UTC)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-analysis
  cancel-in-progress: false

jobs:
  analyse-depot:
    name: "Analyse complète du dépôt"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification TypeScript (typecheck)
        id: typecheck
        continue-on-error: true
        run: |
          npm run typecheck 2>&1 | tee /tmp/typecheck-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Audit de sécurité des dépendances
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > /tmp/audit-output.json || true
          npm audit 2>&1 | tee /tmp/audit-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Vérification des dépendances obsolètes
        id: outdated
        continue-on-error: true
        run: |
          npm outdated --json > /tmp/outdated-output.json || true
          npm outdated 2>&1 | tee /tmp/outdated-output.txt || true

      - name: Analyse de la structure du projet
        id: structure
        run: |
          {
            echo "## Fichiers détectés"
            echo ""
            echo '```'
            find . -type f \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              | sort
            echo '```'
            echo ""
            echo "## Fichiers volumineux (> 500 Ko)"
            echo ""
            find . -type f \
              -not -path './.git/*' \
              -not -path './node_modules/*' \
              -size +500k \
              -exec ls -lh {} \; || echo "Aucun fichier volumineux détecté."
          } > /tmp/structure-output.txt

      - name: Recherche de patterns problématiques
        id: patterns
        run: |
          rg -n -g '!node_modules/**' -g '!.git/**' -g '!package-lock.json' \
            -e "(TODO|FIXME|HACK|XXX|WARN)" . > /tmp/patterns-todos.txt || true
          rg -n -g '!node_modules/**' -g '!.git/**' \
            -e "console\\.log" . > /tmp/patterns-console.txt || true
          rg -n -g '!node_modules/**' -g '!.git/**' -g '!package-lock.json' \
            -e "(api[_-]?key|secret|password|token)\\s*[:=]" -i . > /tmp/patterns-secrets.txt || true

      - name: Génération du compte rendu
        run: |
          TYPECHECK_EXIT="${{ steps.typecheck.outputs.exit_code || '0' }}" \
          AUDIT_EXIT="${{ steps.audit.outputs.exit_code || '0' }}" \
          node .github/scripts/nightly-analysis-report.mjs /tmp/report.md "${{ github.ref_name }}"

      - name: Créer ou mettre à jour l'issue avec le rapport
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd
        with:
          title: "🔍 Rapport d'Analyse Nocturne"
          content-filepath: /tmp/report.md
          labels: |
            analyse-nocturne
            automatique
          update-existing: true
