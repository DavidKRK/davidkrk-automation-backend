# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which checks out your Infrastructure as Code Configuration files,
# such as Kubernetes, Helm & Terraform and scans them for any security issues.
# The results are then uploaded to GitHub Security Code Scanning
#
# For more examples, including how to limit scans to only high-severity issues
# and fail PR checks, see https://github.com/snyk/actions/

name: Snyk Infrastructure as Code

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '24 8 * * 1'

permissions:
  contents: read

concurrency:
  group: snyk-iac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run Snyk to check configuration files for security issues
        if: env.SNYK_TOKEN != ''
        # Snyk can be used to break the build when it detects security issues.
        # In this case we want to upload the issues to GitHub Code Scanning
        continue-on-error: true
        uses: snyk/actions/iac@c7971c2fc036368a2c59c8d48a0357dad1780f0d
        with:
          # Scan the whole repository for supported Infrastructure as Code
          # configuration files (e.g. CloudFormation, Terraform, Kubernetes).
          file: .
          sarif: true
      - name: Skip Snyk scan when token is missing
        if: env.SNYK_TOKEN == ''
        run: |
          echo "SNYK_TOKEN non configuré: scan Snyk IaC ignoré."
      - name: Upload result to GitHub Code Scanning
        if: env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b
        with:
          sarif_file: snyk.sarif
